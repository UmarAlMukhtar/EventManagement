name: Java backend

on:
  push:
    paths: ['backend/**', '.github/workflows/java-backend.yml']
  pull_request:
    paths: ['backend/**', '.github/workflows/java-backend.yml']

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        database: [h2, mariadb]
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: test-only-password
          MARIADB_DATABASE: event_management_test
        ports: ['3307:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Verify API and build executable JAR
        working-directory: backend
        env:
          TEST_DB_URL: ${{ matrix.database == 'mariadb' && 'jdbc:mariadb://127.0.0.1:3307/event_management_test' || '' }}
          TEST_DB_USER: ${{ matrix.database == 'mariadb' && 'root' || 'sa' }}
          TEST_DB_PASSWORD: ${{ matrix.database == 'mariadb' && 'test-only-password' || '' }}
        run: ./mvnw -B verify
