# An existing backend/.env still works when started from backend/.
spring.config.import=optional:file:.env[.properties]
server.port=${PORT:3000}
spring.datasource.url=${DB_URL:jdbc:mariadb://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:event_management}}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=10
spring.sql.init.mode=always
# This script only creates/seeds ID counters. It never drops application tables.
spring.sql.init.schema-locations=classpath:id-sequences.sql
spring.jackson.time-zone=UTC
app.jwt-secret=${JWT_SECRET}
app.cors-origins=${CORS_ORIGINS:http://localhost:5173}
server.error.include-message=never
